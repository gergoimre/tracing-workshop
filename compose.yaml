name: tracing-workshop

# ── Shared build context ───────────────────────────────────────────────────────
x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile

# ── Shared tracing environment ─────────────────────────────────────────────────
# Micrometer Tracing reads the OTLP endpoint from application.yml
# (management.otlp.tracing.endpoint), which itself interpolates
# OTEL_EXPORTER_OTLP_ENDPOINT. OTEL_SERVICE_NAME sets spring.application.name
# so the service name appears correctly in Tempo.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:

  # ── Observability stack ──────────────────────────────────────────────────────

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  promtail:
    image: grafana/promtail:3.2.0
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./observability/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      GF_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/slow-traces.json
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/slow-traces.json
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Leaf services (400m) ─────────────────────────────────────────────────────

  session:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: session
      OTEL_SERVICE_NAME: session-store-service
      SERVER_PORT: "8085"
    ports:
      - "8085:8085"
    depends_on:
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  device:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: device
      OTEL_SERVICE_NAME: device-service
      SERVER_PORT: "8087"
    ports:
      - "8087:8087"
    depends_on:
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8087/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  accounts:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: accounts
      OTEL_SERVICE_NAME: accounts-service
      SERVER_PORT: "8089"
    ports:
      - "8089:8089"
    depends_on:
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8089/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  audit:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: audit
      OTEL_SERVICE_NAME: audit-service
      SERVER_PORT: "8091"
    ports:
      - "8091:8091"
    depends_on:
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8091/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  screening:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: screening
      OTEL_SERVICE_NAME: screening-service
      SERVER_PORT: "8092"
    ports:
      - "8092:8092"
    depends_on:
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8092/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Hub services (600m) ──────────────────────────────────────────────────────

  fx:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: fx
      OTEL_SERVICE_NAME: fx-service
      SERVER_PORT: "8082"
      FX_DELAY_MS: "1000"
    ports:
      - "8082:8082"
    depends_on:
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  support:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: support
      OTEL_SERVICE_NAME: support-service
      SERVER_PORT: "8083"
    ports:
      - "8083:8083"
    depends_on:
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  auth:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: auth
      OTEL_SERVICE_NAME: auth-service
      SERVER_PORT: "8084"
      SESSION_URL: http://session:8085
    ports:
      - "8084:8084"
    depends_on:
      session:
        condition: service_healthy
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  risk:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: risk
      OTEL_SERVICE_NAME: risk-service
      SERVER_PORT: "8086"
      DEVICE_URL: http://device:8087
      SCREENING_URL: http://screening:8092
    ports:
      - "8086:8086"
    depends_on:
      device:
        condition: service_healthy
      screening:
        condition: service_healthy
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  ledger:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: ledger
      OTEL_SERVICE_NAME: ledger-service
      SERVER_PORT: "8088"
      ACCOUNTS_URL: http://accounts:8089
    ports:
      - "8088:8088"
    depends_on:
      accounts:
        condition: service_healthy
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8088/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  notification:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: notification
      OTEL_SERVICE_NAME: notification-service
      SERVER_PORT: "8090"
      AUDIT_URL: http://audit:8091
    ports:
      - "8090:8090"
    depends_on:
      audit:
        condition: service_healthy
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  pricing:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: pricing
      OTEL_SERVICE_NAME: pricing-service
      SERVER_PORT: "8081"
      FX_URL: http://fx:8082
      SUPPORT_URL: http://support:8083
      LEDGER_URL: http://ledger:8088
    ports:
      - "8081:8081"
    depends_on:
      fx:
        condition: service_healthy
      support:
        condition: service_healthy
      ledger:
        condition: service_healthy
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  transfer:
    build: *app-build
    image: tracing-workshop-app:latest
    environment:
      <<: *otel-env
      APP_ROLE: transfer
      OTEL_SERVICE_NAME: transfer-service
      SERVER_PORT: "8080"
      PRICING_URL: http://pricing:8081
      SUPPORT_URL: http://support:8083
      AUTH_URL: http://auth:8084
      RISK_URL: http://risk:8086
      LEDGER_URL: http://ledger:8088
      NOTIFICATION_URL: http://notification:8090
      AUDIT_URL: http://audit:8091
    ports:
      - "8080:8080"
    depends_on:
      pricing:
        condition: service_healthy
      support:
        condition: service_healthy
      auth:
        condition: service_healthy
      risk:
        condition: service_healthy
      notification:
        condition: service_healthy
      audit:
        condition: service_healthy
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Ready banner ─────────────────────────────────────────────────────────────
  workshop-ready:
    image: alpine:3.20
    depends_on:
      transfer:
        condition: service_healthy
      grafana:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ""
        echo "╔══════════════════════════════════════════╗"
        echo "║      Workshop environment is ready!      ║"
        echo "╠══════════════════════════════════════════╣"
        echo "║  API:     http://localhost:8080          ║"
        echo "║  Grafana: http://localhost:3000          ║"
        echo "╚══════════════════════════════════════════╝"
        echo ""
    restart: "no"

volumes:
  tempo-data:
  loki-data:
