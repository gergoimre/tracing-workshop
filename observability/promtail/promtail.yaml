server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: workshop-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=tracing-workshop"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [compose_service]
        regex: workshop-ready
        action: drop
    pipeline_stages:
      # Parse JSON emitted by logstash-logback-encoder
      - json:
          expressions:
            level: level
            message: message
            trace_id: trace_id
            span_id: span_id
            service_name: service_name
      # Promote fields as Loki labels.
      # trace_id and span_id are both indexed to enable per-span log correlation
      # in Grafana: clicking "Logs for this span" on any span in Tempo returns
      # only that span's log lines.
      - labels:
          level:
          trace_id:
          span_id:
          service_name:
      # Replace the raw JSON line with just the human-readable message.
      # Non-JSON lines (framework startup logs) produce an empty message
      # and are dropped here — keeps Loki clean.
      - drop:
          expression: "^$"
      - output:
          source: message
