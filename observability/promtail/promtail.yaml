server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: workshop-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=tracing-workshop"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /tracing-workshop-(.+)-\d+
        target_label: service
        replacement: "$1"
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [compose_service]
        regex: workshop-ready
        action: drop
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            trace_id: trace_id
            span_id: span_id
      - labels:
          level:
          trace_id:
          span_id:
      - output:
          source: message
