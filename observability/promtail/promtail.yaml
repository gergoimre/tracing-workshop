server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: workshop-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=tracing-workshop"]
    relabel_configs:
      # Use container name as the service label
      - source_labels: [__meta_docker_container_name]
        regex: /tracing-workshop-(.+)-\d+
        target_label: service
        replacement: "$1"
      # Keep compose service label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      # Drop healthcheck/workshop-ready noise
      - source_labels: [compose_service]
        regex: workshop-ready
        action: drop
    pipeline_stages:
      # Try to parse JSON logs (from our services)
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            trace_id: trace_id
            span_id: span_id
            service: service
      # Promote trace_id as a label for Tempo correlation
      - labels:
          level:
          trace_id:
      # Use the message field as the log line if present, otherwise keep raw
      - output:
          source: message
