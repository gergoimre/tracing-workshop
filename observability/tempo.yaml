stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Flush blocks quickly so traces are queryable by ID almost immediately.
  max_block_bytes: 1_000_000
  max_block_duration: 30s

compactor:
  compaction:
    block_retention: 2h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
    # vParquet3 is required for TraceQL search in Tempo 2.x
    block:
      version: vParquet3

query_frontend:
  search:
    max_duration: 0

querier: {}
